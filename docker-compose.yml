services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgresql:
    image: postgres:latest
    environment:
      - POSTGRES_USER:admin
      - POSTGRES_PASSWORD:password
      - POSTGRES_DB:Saturn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  saturn:
    

volumes:
  postgres_data:
